name: Deploy

# Deploy hanya jalan setelah workflow CI SELESAI dan HIJAU di master.
# (Dulu: push ke `main` — padahal default branch repo ini `master`, jadi gate-nya
# tidak pernah menyala.)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Don't cancel deploys mid-flight

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production  # Requires manual approval if configured in GitHub settings
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Dicek PALING AWAL. Tanpa target deploy, membangun dulu cuma membakar dua
      # menit lalu gagal dengan pesan menyesatkan: secret yang tidak ada di-pass
      # sebagai string kosong, dan NEXTAUTH_URL='' membuat prerender /login
      # melempar ERR_INVALID_URL — seolah kodenya yang rusak.
      # Konteks `secrets` TIDAK tersedia di `if:`, jadi salin ke env dulu.
      - name: Cek konfigurasi target deploy
        id: ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: echo "configured=${{ env.SSH_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Berhenti kalau tidak ada target deploy
        if: steps.ssh.outputs.configured != 'true'
        run: |
          echo "::error::SSH_HOST belum diset di repo secrets, jadi tidak ada yang"
          echo "::error::dikirim ke server. Produksi saat ini di cPanel Jagoan Hosting"
          echo "::error::dan dideploy manual — lihat DEPLOYMENT.md. Set SSH_HOST,"
          echo "::error::SSH_USER, SSH_PRIVATE_KEY, NEXTAUTH_SECRET, NEXTAUTH_URL,"
          echo "::error::dan DB_* untuk mengaktifkan deploy otomatis."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --production=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      # ── SSH Deploy ──────────────────────────────────────────────────────────
      # Jalur VPS + pm2. Kalau produksi tetap di cPanel (upload ZIP manual),
      # blok ini tidak akan pernah dipakai — hapus saja daripada dibiarkan.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/hris-karyawan
            git pull origin master
            npm ci --production=false
            npx prisma generate
            node --env-file=.env scripts/seed-refdata.cjs
            npm run build
            pm2 restart hris-karyawan || pm2 start npm --name "hris-karyawan" -- start
            pm2 save

      - name: Notify success
        run: echo "Deploy to production successful at $(date)"
